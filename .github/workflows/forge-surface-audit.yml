name: FORGE Surface Audit

# Layer 2 of the derived-surface drift mechanism (issue #229).
# Every Monday 07:00 UTC (and on manual dispatch), invoke the claude CLI with
# the audit protocol at scripts/audit-forge-surface.prompt.md. If the agent
# produces edits — strictly scoped to docs/skills/examples/workflows/CHANGELOG —
# run the repo's verification gates and open a draft PR against development.
# Runs on CI budget, not the user's machine.

on:
  workflow_dispatch:
  # schedule (PAUSED 2026-08-31, pre-v0.2.0): the Anthropic key behind `claude -p` has
  # been out of credit since ~2026-07-20 — every scheduled run failed on
  # "Credit balance is too low" and burned a runner slot weekly (issue #449).
  # To re-enable, restore: `- cron: "0 7 * * 1"` together with the LLM rework in #449.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forge-surface-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Weekly surface audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Preflight — require ANTHROPIC_API_KEY
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set; cannot run audit."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install claude CLI
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Configure git identity
        run: |
          git config user.name "forge-surface-audit[bot]"
          git config user.email "forge-surface-audit@users.noreply.github.com"

      - name: Run audit
        run: bash scripts/audit-forge-surface.sh
