name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run test suite
        # Windows default thread stack is 1 MiB; cargo test spawns each test
        # on a thread that honors RUST_MIN_STACK. The wiki docgen flow
        # (six parallel reason() stages with multi-KB prompts) sits at the
        # edge of that limit and tips into a stack overflow on minor
        # executor state-machine changes. Bumping to 8 MiB on Windows —
        # matching Linux's default — removes the platform-specific cliff
        # without masking a real bug. Linux/macOS defaults stay as-is. (#380)
        env:
          RUST_MIN_STACK: ${{ matrix.os == 'windows-latest' && '8388608' || '' }}
        run: cargo test
      # StartupManager E2E (#254): exercise the real launchctl/systemd path
      # on macOS and Linux. Linux needs a user systemd session; if it's not
      # available in the runner, the test skips itself cleanly.
      - name: StartupManager E2E (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          loginctl enable-linger "$USER" || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          FORGE_SERVICE_E2E=1 cargo test --test startup_manager_tests
      - name: StartupManager E2E (macOS)
        if: matrix.os == 'macos-latest'
        run: FORGE_SERVICE_E2E=1 cargo test --test startup_manager_tests
      # Install script E2E (#257): verify cross-platform install/uninstall round-trip
      - name: Install script E2E (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          bash scripts/install-sensei.sh --skip-pretrain
          test -x "$HOME/.forge/bin/forge-sensei"
          test -x "$HOME/.forge/bin/forge-sensei-server"
          bash scripts/install-sensei-server.sh install
          bash scripts/install-sensei-server.sh status
          bash scripts/install-sensei-server.sh uninstall
          bash scripts/install-sensei.sh --uninstall

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
