name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: [Cargo.lock]

permissions:
  checks: write
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
