# Dev-cycle standalone runtime config — T8.5 (#360).
#
# `workflows/dev-cycle/main.forge` runs without the full clone-dev
# assembly, but agents.forge now reads CloneDevConfig (issue #357,
# T8.2) for workdir/branch/commit/iteration/auto-approve knobs. This
# fixture supplies a minimal config so the standalone runner doesn't
# need every clone-dev section just to start.
#
# Override per-tenant:
#   FORGE_CLONEDEV_CONFIG=/path/to/your/clone-dev.toml \
#   forge serve --manifest workflows/dev-cycle/forge.project.toml \
#               workflows/dev-cycle/main.forge

[org]
name = "dev-cycle-standalone"

[slack]
default_channel = ""
bot_token_env   = "SLACK_BOT_TOKEN"
# T10.2 (#368) — channel ID gate_two posts plan-approval cards into.
# Empty ⇒ fall back to PlanReady.channel (per-issue routing).
approval_channel = ""

[github]
token_env    = "GITHUB_TOKEN"
# T10.1 (#367) — single repo gate_one writes propose_issue approvals
# into. Empty string = unset; gate_one will skip the issue creation
# step and only emit ProposalRejected if no default is configured.
default_repo = "ncmlabs/forge"

# ── [gates] (T10.1, #367; T10.2, #368) ────────────────────────────
# Gate-1 (create-issue) toggles consumed by gate_one.
#   create_issue              = false → auto-approve every propose_issue
#                                       proposal (decision_by = "auto").
#   create_issue_timeout_mins        → minutes a pending approval may
#                                       sit before gate_one escalates
#                                       via warden + emits ProposalRejected
#                                       (reason="timeout").
# Gate-2 (start-implementation) toggles consumed by gate_two.
#   start_implementation              = false → auto-emit
#                                               ImplementationApproved
#                                               for every PlanReady
#                                               (decision_by =
#                                               "auto (policy)").
#   start_implementation_timeout_mins        → minutes a pending plan
#                                               approval may sit before
#                                               gate_two escalates via
#                                               warden + emits
#                                               ImplementationRejected
#                                               (decision_by="system").
[gates]
create_issue                      = true
create_issue_timeout_mins         = 30
start_implementation              = true
start_implementation_timeout_mins = 30

# ── [llm.routing] (T8.6, #361) ────────────────────────────────────
# Phase → primary provider. Provider IDs reference [providers.*] in
# workflows/clone-dev/forge.config.toml. Mixed providers per the
# track plan: Anthropic for plan/review (deeper reasoning), OpenAI
# for implement (throughput), local Ollama for ops_investigate (no
# egress). When the mastermind classifies an inbound task, the
# `classify` chain runs first.
[llm.routing]
classify             = "sonnet"
plan                 = "sonnet"
implement            = "gpt-4o"
review               = "sonnet"
ops_investigate      = "ollama-local"
code_investigate     = "sonnet"     # T9.2 (#363) — code_investigator
security_investigate = "sonnet"     # T9.2 (#363) — security_investigator

# Optional per-phase fallback chains. Tried in order when the
# primary provider above errors (timeout / 5xx). Cost is charged
# to whichever provider actually served the response.
[llm.routing.fallback]
plan                 = ["sonnet", "gpt-4o"]
implement            = ["gpt-4o", "sonnet"]
review               = ["sonnet", "gpt-4o"]
ops_investigate      = ["sonnet"]
code_investigate     = ["gpt-4o"]
security_investigate = ["gpt-4o"]

[defaults]
# Built-in dev-cycle defaults — keep in sync with the constants in
# src/runtime/clone_dev_config.rs (DEFAULT_WORKDIR_ROOT etc.). Each
# can be overridden per-repo via [repos."<owner>/<name>"].
workdir_root        = "/tmp/forge-workdir"
branch_prefix       = "clone-dev"
commit_template     = "feat({issue_id}): implement per plan"
fix_commit_template = "fix({issue_id}): iteration {iteration}"
max_iterations      = 3
auto_approve        = false
test_cmd            = "cargo test --quiet"
# T10.2 (#368) — bound on planner re-plan attempts triggered by
# gate_two's ImplementationRejected feedback. Beyond this, the
# planner escalates rather than emit yet another PlanReady.
max_plan_revisions  = 3
