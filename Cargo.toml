[package]
name = "forge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "FORGE — an agent-native programming language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ncmlabs/forge"
homepage = "https://github.com/ncmlabs/forge"
readme = "README.md"
authors = ["NCM Labs"]
keywords = ["language", "agents", "llm", "programming-language", "ai"]
categories = ["command-line-utilities", "compilers"]
exclude = [".claude/", "docs/superpowers/", ".forge-security-allow", "conformance/", ".worktrees/"]

[dependencies]
pest = "2"
pest_derive = "2"
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ariadne = "0.6"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
toml = "0.8"
dirs = "6"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs"] }
redb = "2"

[dev-dependencies]
tempfile = "3"
