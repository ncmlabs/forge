# FORGE Wiki — configuration
# Start: forge serve examples/wiki/server.forge -s examples/wiki/shared.forge --watch

[llm]
default = "wiki-provider"

[providers.wiki-provider]
type = "anthropic"
model = "claude-sonnet-4-20250514"
api_key = "${ANTHROPIC_API_KEY}"

[server]
host = "127.0.0.1"
port = 3000

[server.static]
root = "examples/wiki/static"
prefix = "/static"
